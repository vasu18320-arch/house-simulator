<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>HOUSE SIMULATOR</title>
<style>
*{box-sizing:border-box}
body{margin:0;overflow:hidden;font-family:Arial;background:#b9e3f5}
#game{position:fixed;inset:0}
#ui{position:fixed;inset:0;pointer-events:none;color:#fff}
header{padding:14px;text-align:center;font-size:23px;font-weight:900;text-shadow:0 2px 5px #333}
.panel{pointer-events:auto;position:absolute;top:65px;left:10px;width:190px;max-height:65vh;overflow:auto;background:#ffffffed;color:#333;border-radius:17px;padding:12px;box-shadow:0 4px 15px #0003}
.panel h3{margin:4px 0 9px;color:#6b4b9b}
button{border:0;border-radius:10px;padding:10px;margin:3px;background:#8e69c8;color:white;font-weight:bold}
button:active{transform:scale(.96)}
.panel button{width:100%;text-align:left}
#status{position:absolute;top:12px;right:10px;background:#ffffffdd;color:#333;border-radius:12px;padding:9px;font-size:12px}
#joystick{position:absolute;bottom:25px;left:25px;width:110px;height:110px;border-radius:50%;background:#ffffff55;border:2px solid #fff;pointer-events:auto;touch-action:none}
#stick{position:absolute;width:45px;height:45px;left:31px;top:31px;border-radius:50%;background:#fff9;box-shadow:0 2px 7px #555}
#portrait{position:absolute;right:15px;bottom:30px;pointer-events:auto}
#message{position:absolute;bottom:155px;left:50%;transform:translateX(-50%);background:#222b;padding:8px 14px;border-radius:15px;font-size:12px;white-space:nowrap}
#hide{position:absolute;right:10px;top:60px}
</style>
</head>
<body>
<div id="game"></div>
<div id="ui">
<header>🏡 HOUSE SIMULATOR</header>
<div id="status">Build your dream life ❤️</div>
<button id="hide" onclick="togglePanel()">☰ MENU</button>
<div class="panel" id="panel">
<h3>🌍 Choose your world</h3>
<button onclick="setWorld('Mountain')">🏔️ Mountain view</button>
<button onclick="setWorld('Countryside')">🌳 Countryside</button>
<button onclick="setWorld('City')">🏙️ City</button>
<h3>🏠 Choose your house</h3>
<button onclick="setHouse(0)">Simple house</button>
<button onclick="setHouse(1)">Moderate house</button>
<button onclick="setHouse(2)">Grand farmhouse</button>
<h3>👗 Outfits</h3>
<button onclick="outfit(0)">Casual</button>
<button onclick="outfit(1)">Traditional</button>
<button onclick="outfit(2)">Party outfit</button>
<h3>🐾 Pets</h3>
<button onclick="addPet('Cat')">🐈 Add cat</button>
<button onclick="addPet('Dog')">🐕 Add dog</button>
<button onclick="addPet('Cow')">🐄 Add cow</button>
<button onclick="addPet('Parrot')">🦜 Add parrot</button>
<button onclick="addPet('Hamster')">🐹 Add hamster</button>
<h3>🚗 Vehicles</h3>
<button onclick="addVehicle('SUV')">🚙 Big SUV</button>
<button onclick="addVehicle('Car')">🚘 Small car</button>
<button onclick="addVehicle('Pickup')">🛻 Pickup truck</button>
<button onclick="addVehicle('Bike')">🏍️ Motorcycle</button>
<button onclick="addVehicle('Bicycle')">🚲 Bicycle</button>
<button onclick="addVehicle('Tractor')">🚜 Tractor</button>
<h3>👶 Family</h3>
<button onclick="addBaby('Baby girl')">🎀 Add baby girl</button>
<button onclick="addBaby('Baby boy')">🧸 Add baby boy</button>
<div id="family"></div>
<button onclick="makePortrait()" style="background:#e68a9c">❤️ Family portrait</button>
</div>
<div id="message">Drag to look around · Use joystick to move</div>
<div id="joystick"><div id="stick"></div></div>
<button id="portrait" onclick="makePortrait()">📸 Family photo</button>
</div>
<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';

const scene=new THREE.Scene();
scene.background=new THREE.Color(0x9bd2f2);
scene.fog=new THREE.Fog(0x9bd2f2,35,100);
const camera=new THREE.PerspectiveCamera(60,innerWidth/innerHeight,.1,200);
camera.position.set(0,7,14);
const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setSize(innerWidth,innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.shadowMap.enabled=true;
document.getElementById('game').appendChild(renderer.domElement);
scene.add(new THREE.HemisphereLight(0xffffff,0x637b55,2));
const sun=new THREE.DirectionalLight(0xffffff,2);
sun.position.set(-10,20,10);sun.castShadow=true;scene.add(sun);

const mat=(color)=>new THREE.MeshStandardMaterial({color,roughness:.85});
const green=mat(0x6baf68),brown=mat(0x81543b),white=mat(0xffffff);
const ground=new THREE.Mesh(new THREE.PlaneGeometry(200,200),green);
ground.rotation.x=-Math.PI/2;ground.receiveShadow=true;scene.add(ground);

function box(x,y,z,sx,sy,sz,color){
const o=new THREE.Mesh(new THREE.BoxGeometry(sx,sy,sz),mat(color));
o.position.set(x,y,z);o.castShadow=true;o.receiveShadow=true;scene.add(o);return o;
}
function sphere(x,y,z,r,color){
const o=new THREE.Mesh(new THREE.SphereGeometry(r,16,12),mat(color));
o.position.set(x,y,z);o.castShadow=true;scene.add(o);return o;
}
function tree(x,z){
const trunk=box(x,1,z,.35,2,.35,0x79502f);
sphere(x,2.6,z,1.25,0x347c48);
sphere(x-.55,2.3,z, .75,0x438c4c);
}
for(let i=0;i<35;i++){
let x=(Math.random()-.5)*65,z=(Math.random()-.5)*65;
if(Math.abs(x)>8||Math.abs(z)>8)tree(x,z);
}
function mountain(x,z,s){
const m=new THREE.Mesh(new THREE.ConeGeometry(s, s*1.5,5),mat(0x829caa));
m.position.set(x,s*.65,z);scene.add(m);
}
for(let i=0;i<12;i++)mountain((i-6)*10,-35-Math.random()*15,8+Math.random()*8);

let houseParts=[],people=[],pets=[],vehicles=[],babies=[];
function clearGroup(arr){arr.forEach(o=>scene.remove(o));arr.length=0}
function buildHouse(tier){
clearGroup(houseParts);
const add=o=>houseParts.push(o);
let width=[5,7,10][tier],height=[2.8,3.5,4.5][tier];
add(box(0,height/2,-5,width,height,width*.7,[0xe4c5a2,0xf0dfc3,0xffffff][tier]));
let roof=new THREE.Mesh(new THREE.ConeGeometry(width*.85,2.2,4),mat([0x914d37,0x6b4141,0x384d63][tier]));
roof.position.set(0,height+1,-5);roof.rotation.y=Math.PI/4;scene.add(roof);add(roof);
add(box(0,1.1,-1.4,1.1,2.2,.15,0x70442e));
for(let x of [-width*.28,width*.28])add(box(x,1.9,-1.38,1.1,1,.15,0x83c8e8));
if(tier>0){
add(box(0,height+.1,-5,width*.55,.2,width*.6,0x8e6344));
}
}
function person(x,z,isGirl=false){
let group=new THREE.Group();
let skin=mat(0xc98f6c),hair=mat(isGirl?0x17121c:0x28201b);
let clothes=mat(isGirl?0xe88db4:0x4c86c9);
function part(geo,material,x,y,z){let o=new THREE.Mesh(geo,material);o.position.set(x,y,z);o.castShadow=true;group.add(o);return o}
part(new THREE.CapsuleGeometry(.38,.85,4,8),clothes,0,1.05,0);
part(new THREE.SphereGeometry(.42,20,16),skin,0,2,0);
part(new THREE.SphereGeometry(.44,16,12),hair,0,2.22,-.1);
if(isGirl)part(new THREE.SphereGeometry(.2,12,10),hair,-.35,1.95,0);
for(let x of [-.15,.15])part(new THREE.SphereGeometry(.045,10,8),mat(0x21150f),x,2.03,.37);
part(new THREE.SphereGeometry(.08,12,10),skin,0,1.88,.38);
group.position.set(x,0,z);scene.add(group);return group;
}
const vasu=person(-1,2,false),shelly=person(1,2,true);
people.push(vasu,shelly);
buildHouse(0);
let world='Mountain',tier=0;
window.setWorld=(w)=>{
world=w;
scene.background=new THREE.Color(w==='Mountain'?0x9bd2f2:w==='City'?0xb7c7d8:0xb4dca1);
ground.material=mat(w==='City'?0x858b8c:w==='Mountain'?0x6baf68:0x7fba69);
document.getElementById('status').textContent=w+' world selected';
};
window.setHouse=(t)=>{tier=t;buildHouse(t);document.getElementById('status').textContent=['Simple house','Moderate house','Grand farmhouse'][t]+' selected'};
window.outfit=(t)=>{
vasu.children[0].material=mat([0x4c86c9,0x9a533c,0x3a345d][t]);
shelly.children[0].material=mat([0xe88db4,0xf2a64b,0x9a69c8][t]);
};
function animal(name,x,z){
let g=new THREE.Group(),c=mat(name==='Cow'?0xffffff:name==='Cat'?0x777777:name==='Dog'?0x9b633e:name==='Parrot'?0x26a45a:0xc9a16d);
let body=new THREE.Mesh(new THREE.SphereGeometry(.55,16,12),c);body.scale.set(1.3,.8,.8);body.position.y=.6;g.add(body);
let head=new THREE.Mesh(new THREE.SphereGeometry(.3,16,12),c);head.position.set(.5,.95,0);g.add(head);
g.position.set(x,0,z);scene.add(g);return g;
}
window.addPet=(name)=>{pets.push(animal(name,-5+pets.length*1.4,4));document.getElementById('status').textContent=name+' added!'};
function vehicle(name,x,z){
let g=new THREE.Group(),color=mat(name==='SUV'?0x263f69:name==='Bike'?0xb82f2f:name==='Tractor'?0x3b9c46:0xd2a53b);
let body=new THREE.Mesh(new THREE.BoxGeometry(name==='Bicycle'?1.5:2.5,.7,1.2),color);body.position.y=.8;g.add(body);
if(name!=='Bicycle'){
let top=new THREE.Mesh(new THREE.BoxGeometry(1.2,.6,1),mat(0x8ac4df));top.position.set(0,1.4,0);g.add(top);
}
for(let x of [-.8,.8])for(let z of [-.55,.55]){
let wheel=new THREE.Mesh(new THREE.CylinderGeometry(.3,.3,.18,16),mat(0x222222));
wheel.rotation.z=Math.PI/2;wheel.position.set(x,.35,z);g.add(wheel);
}
g.position.set(5+vehicles.length*2,0,4);scene.add(g);return g;
}
window.addVehicle=(name)=>{vehicles.push(vehicle(name));document.getElementById('status').textContent=name+' added!'};
window.addBaby=(name)=>{
let b=person(-1+babies.length*.7,3,true);
b.scale.setScalar(.55);babies.push(b);
document.getElementById('family').textContent='Babies: '+babies.length;
document.getElementById('status').textContent=name+' added ❤️';
};
window.makePortrait=()=>{
camera.position.set(0,7,13);camera.lookAt(0,1,0);
document.getElementById('status').textContent='❤️ Your family portrait is ready! Take a screenshot.';
};
window.togglePanel=()=>{let p=document.getElementById('panel');p.style.display=p.style.display==='none'?'block':'none'};
let moving={x:0,y:0},drag=false,lastX=0,lastY=0,angle=0;
const joy=document.getElementById('joystick'),stick=document.getElementById('stick');
joy.addEventListener('pointerdown',e=>{drag=true;joy.setPointerCapture(e.pointerId);moveJoy(e)});
joy.addEventListener('pointermove',e=>{if(drag)moveJoy(e)});
joy.addEventListener('pointerup',()=>{drag=false;moving={x:0,y:0};stick.style.transform='translate(0,0)'});
function moveJoy(e){
let r=joy.getBoundingClientRect(),x=e.clientX-r.left-55,y=e.clientY-r.top-55;
let d=Math.hypot(x,y),s=Math.min(35,d);if(d){moving={x:x/d*s/35,y:y/d*s/35}}
stick.style.transform=`translate(${moving.x*35}px,${moving.y*35}px)`;
}
renderer.domElement.addEventListener('pointerdown',e=>{if(e.target===renderer.domElement){lastX=e.clientX;lastY=e.clientY;drag=true}});
renderer.domElement.addEventListener('pointermove',e=>{if(drag&&e.buttons){angle-=(e.clientX-lastX)*.005;lastX=e.clientX;lastY=e.clientY}});
renderer.domElement.addEventListener('pointerup',()=>drag=false);
function animate(){
requestAnimationFrame(animate);
vasu.position.x+=moving.x*.06;vasu.position.z+=moving.y*.06;
shelly.position.x=vasu.position.x+1.2;shelly.position.z=vasu.position.z;
camera.position.x=vasu.position.x+Math.sin(angle)*13;
camera.position.z=vasu.position.z+Math.cos(angle)*13;
camera.lookAt(vasu.position.x,1,vasu.position.z);
renderer.render(scene,camera);
}
animate();
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
</script>
</body>
</html>
